<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập 35b - Đồng hồ đếm ngược</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
        }

        .container {
            background: white;
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 380px;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 22px;
        }

        .timer-display {
            font-size: 64px;
            font-weight: bold;
            color: #2c3e50;
            margin: 20px 0;
            letter-spacing: 2px;
        }

        /* Hiệu ứng khi thời gian dưới 1 phút */
        .warning {
            color: #e74c3c;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 25px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-start { background-color: #2ecc71; color: white; }
        .btn-start:hover { background-color: #27ae60; }

        .btn-pause { background-color: #f39c12; color: white; }
        .btn-pause:hover { background-color: #d68910; }

        .btn-reset { background-color: #95a5a6; color: white; }
        .btn-reset:hover { background-color: #7f8c8d; }

        /* Modal Alert khi hết giờ */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            width: 300px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .modal-content h3 {
            color: #e74c3c;
            margin-bottom: 10px;
        }

        .modal-content p {
            color: #555;
            margin-bottom: 20px;
        }

        .btn-close {
            background-color: #3498db;
            color: white;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Đồng Hồ Đếm Ngược</h2>
        <div id="timer" class="timer-display">10:00</div>
        
        <div class="controls">
            <button class="btn-start" onclick="startTimer()">Bắt đầu</button>
            <button class="btn-pause" onclick="pauseTimer()">Tạm dừng</button>
            <button class="btn-reset" onclick="resetTimer()">Đặt lại</button>
        </div>
    </div>

    <!-- Modal thông báo hết giờ -->
    <div id="timeUpModal" class="modal">
        <div class="modal-content">
            <h3>Hết giờ!</h3>
            <p>Thời gian 10 phút đếm ngược đã kết thúc.</p>
            <button class="btn-close" onclick="closeModal()">Đóng</button>
        </div>
    </div>

    <script>
        const INITIAL_TIME = 10 * 60; // 10 phút = 600 giây
        let timeLeft = INITIAL_TIME;
        let timerInterval = null; // Lưu ID của interval để quản lý

        const timerDisplay = document.getElementById('timer');
        const modal = document.getElementById('timeUpModal');

        // Hàm định dạng giây thành MM:SS
        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;

            // Thêm số 0 ở trước nếu nhỏ hơn 10 (ví dụ: 09:05)
            const formattedMin = minutes < 10 ? '0' + minutes : minutes;
            const formattedSec = seconds < 10 ? '0' + seconds : seconds;

            timerDisplay.textContent = `${formattedMin}:${formattedSec}`;

            // Thêm hiệu ứng cảnh báo khi dưới 1 phút (60 giây)
            if (timeLeft < 60 && timeLeft > 0) {
                timerDisplay.classList.add('warning');
            } else {
                timerDisplay.classList.remove('warning');
            }
        }

        function startTimer() {
            // Kiểm tra nếu interval đang chạy thì không tạo thêm (tránh chạy chồng chéo)
            if (timerInterval !== null) return;

            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateDisplay();
                } else {
                    // Hết giờ: Dừng interval và hiện modal
                    clearInterval(timerInterval);
                    timerInterval = null;
                    timerDisplay.classList.remove('warning');
                    modal.style.display = 'flex';
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
        }

        function resetTimer() {
            pauseTimer(); // Xóa interval cũ trước khi reset
            timeLeft = INITIAL_TIME;
            updateDisplay();
        }

        function closeModal() {
            modal.style.display = 'none';
            resetTimer();
        }

        // Khởi tạo hiển thị ban đầu
        updateDisplay();
    </script>
</body>
</html>
